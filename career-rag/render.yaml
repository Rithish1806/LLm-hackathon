services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: career-rag-backend
    runtime: python
    rootDir: career-rag/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  # 2. React + Vite Frontend Static Site
  - type: web
    name: career-rag-frontend
    runtime: static
    rootDir: career-rag/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: career-rag-backend
          property: host
